name: 核对油价和原油趋势并发布 Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2,12 * * *' # 北京时间每天 10:00、20:00；GitHub 定时任务可能延迟。
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: besfuel-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: windows-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 核对广东及已接入地区的官方油价
        shell: pwsh
        run: |
          powershell -NoProfile -File .\scripts\update-guangdong.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Warning '广东公告核对失败；保留此前可信快照。'
            '广东：本次核对失败，已保留此前可信价格和核对日期。' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          npm run update:regions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:monitors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run validate:data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 更新原油趋势与备用来源状态
        shell: pwsh
        env:
          BESFUEL_YAHOO_PROXY: ''
        run: |
          npm run update:crude:ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 运行测试并检查站点产物
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BESFUEL_SITE_DIR = Join-Path $PWD 'public'
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 记录有变化的可信快照
        shell: pwsh
        run: |
          git add data/prices.json data/prices.js data/crude-prices.json data/crude-prices.js
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): 核对官方油价与原油趋势'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

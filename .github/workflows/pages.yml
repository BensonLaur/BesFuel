name: 核对油价和原油趋势并发布 Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2,12 * * *' # 北京时间每天 10:00、20:00；GitHub 定时任务可能延迟。
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: besfuel-pages
  cancel-in-progress: false

jobs:
  fetch-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        if: vars.BESFUEL_FC_ENABLED == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: vars.BESFUEL_FC_ENABLED == 'true'
        with:
          node-version: '22'
      - name: 安装固定版本的 OSS 客户端
        if: vars.BESFUEL_FC_ENABLED == 'true'
        run: npm ci --ignore-scripts
      - name: 检查 FC 接入配置
        if: vars.BESFUEL_FC_ENABLED == 'true'
        env:
          PROVIDER: ${{ vars.BESFUEL_ALIYUN_OIDC_PROVIDER_ARN }}
          ROLE: ${{ vars.BESFUEL_ALIYUN_READ_ROLE_ARN }}
          BUCKET: ${{ vars.BESFUEL_OSS_BUCKET }}
        run: node -e 'for (const key of ["PROVIDER", "ROLE", "BUCKET"]) if (!process.env[key]) throw new Error("Missing " + key)'
      - name: 以 GitHub OIDC 获取只读临时身份
        if: vars.BESFUEL_FC_ENABLED == 'true'
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.BESFUEL_ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.BESFUEL_ALIYUN_READ_ROLE_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 900
          role-session-name: besfuel-read-${{ github.run_id }}
      - name: 下载并校验 FC 官方来源快照
        if: vars.BESFUEL_FC_ENABLED == 'true'
        env:
          BESFUEL_OSS_BUCKET: ${{ vars.BESFUEL_OSS_BUCKET }}
          BESFUEL_OSS_REGION: cn-hangzhou
        run: node scripts/download-cloud.cjs "$RUNNER_TEMP/fc-regions.json"
      - uses: actions/upload-artifact@v4
        if: vars.BESFUEL_FC_ENABLED == 'true'
        with:
          name: fc-regions
          path: ${{ runner.temp }}/fc-regions.json
          if-no-files-found: error
          retention-days: 14
  update-and-deploy:
    needs: fetch-regions
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
      issues: write
    env:
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 安装固定版本的运行与测试依赖
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        if: vars.BESFUEL_FC_ENABLED == 'true'
        with:
          name: fc-regions
          path: ${{ runner.temp }}/fc-regions
      - name: 核对广东官方油价
        shell: pwsh
        run: |
          powershell -NoProfile -File .\scripts\update-guangdong.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Warning '广东公告核对失败；保留此前可信快照。'
            '广东：本次核对失败，已保留此前可信价格和核对日期。' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            # The runner otherwise propagates the child process exit code after this fallback.
            exit 0
          }
      - name: 核对已接入地区（FC 尚未启用）
        if: vars.BESFUEL_FC_ENABLED != 'true'
        shell: pwsh
        run: |
          npm run update:regions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:monitors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 安装经哈希校验的官方表格读取器
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r scripts/review-requirements.txt
      - name: 自动核价并校验官方正文与附件
        shell: pwsh
        env:
          BESFUEL_REVIEW_REPORT: ${{ runner.temp }}/automatic-review.json
          BESFUEL_FC_ENABLED: ${{ vars.BESFUEL_FC_ENABLED }}
        run: |
          if ($env:BESFUEL_FC_ENABLED -eq 'true') {
            node scripts/automatic-review.cjs "$env:RUNNER_TEMP/fc-regions/fc-regions.json"
          } else {
            node scripts/automatic-review.cjs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 校验油价与浏览器快照一致
        run: npm run validate:data
      - name: 更新原油趋势与备用来源状态
        shell: pwsh
        env:
          BESFUEL_YAHOO_PROXY: ''
        run: |
          npm run update:crude:ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 运行测试并检查站点产物
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p '*_test.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BESFUEL_SITE_DIR = Join-Path $PWD 'public'
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 仅提醒需要处理的新异常
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/review-alerts.cjs "$env:RUNNER_TEMP/automatic-review.json"
      - uses: actions/upload-artifact@v4
        with:
          name: automatic-review
          path: ${{ runner.temp }}/automatic-review.json
          retention-days: 14
      - name: 记录有变化的可信快照
        shell: pwsh
        run: |
          git add data/prices.json data/prices.js data/crude-prices.json data/crude-prices.js data/review-alert-state.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): 核对官方油价与原油趋势'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

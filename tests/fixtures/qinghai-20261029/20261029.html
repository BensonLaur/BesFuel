<div class="view TRS_UEDITOR trs_paper_default trs_word trs_key4format trs_web"><p style="text-align: left; line-height: 2em; text-indent: 2em; font-family: 宋体, SimSun; font-size: 19px; margin-top: 0px; margin-bottom: 0px;"><span style="font-family: 宋体, SimSun; text-indent: 43px; font-size: 19px; margin-top: 0px; margin-bottom: 0px; line-height: 2em;">根据国家相关要求，国家发展改革委决定自2026年10月29日24时起提高国内成品油价格，汽、柴油(标准品)价格每吨分别提高345元、335元。根据国家统一规定，我省自2026年10月29日24时起同步调整省内各价区汽、柴油最高零售价格(详见附件)。其他相关成品油价格政策按《石油价格管理办法》有关规定执行。</span></p><p style="text-indent: 2em; line-height: 2em; text-align: left; font-family: 宋体, SimSun; font-size: 19px; margin-top: 0px; margin-bottom: 0px;"><span style="font-family: 宋体, SimSun; font-size: 19px; margin-top: 0px; margin-bottom: 0px; line-height: 2em;">附件:青海省汽、柴油最高零售价格表</span><span style="text-align: center; text-indent: 0em;"></span></p><p style="text-align: center; text-indent: 0em;"><img src="./W020261030518614379022.png" title="999.png" alt="999.png" OLDSRC="W020261030518614379022.png" /></p><div style="text-wrap-mode: wrap;text-indent: 2em;font-family: 宋体, SimSun;font-size: 19px"><p style="line-height: 2em;text-indent: 2em;text-align: justify"><strong><span style="font-size: 16px">注：</span></strong><span style="font-size: 16px">1、表中汽油和柴油价格为符合第六阶段强制性国家标准ⅥB车用汽油和Ⅵ车用柴油价格。</span></p></div><p style="line-height: 2em;text-wrap-mode: wrap;text-indent: 2em;text-align: justify;font-family: 宋体, SimSun;font-size: 19px"><span style="font-size: 16px">2、汽柴油第六阶段标准品分别为89号汽油和0号车用柴油。</span></p><p style="text-indent: 2em; line-height: 2em; text-align: left; font-family: 宋体, SimSun; font-size: 19px; margin-top: 0px; margin-bottom: 0px;"><span style="font-family: 宋体, SimSun; font-size: 19px; margin-top: 0px; margin-bottom: 0px; line-height: 2em;"><br/></span><br/></p><p style="line-height: 2em; font-family: 宋体, SimSun; font-size: 19px; margin-top: 0px; margin-bottom: 0px;"><span style="font-family: 宋体, SimSun; font-size: 19px; margin-top: 0px; margin-bottom: 0px; line-height: 2em;"></span></p></div>
